[theme]
# Deep luxury charcoal/obsidian (used by high-end brands like Apple and Rolex)
backgroundColor = "#0b0c10"

# Sleek brushed-platinum/dark slate for structural containers and boxes
secondaryBackgroundColor = "#1f2833"

# Pure, crisp off-white for highly readable primary text
textColor = "#f5f5f7"

# Premium Champagne Gold for headings, subtle borders, and interactive links
primaryColor = "#c5a059"

# Establishes the deep luxury dark layout mode natively
base = "dark"
